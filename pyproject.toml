[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-instruction-pack"
version = "0.1.0"
description = "Modular instruction pack (core + personas + protocols) with source audit, classification, resolver, CLI, and Hermes Agent adapter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes Instruction Pack maintainers" }]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hip = "hermes_instruction_pack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
